#
# Declarative Jenkins Configuration as Code (JCasC) example for registering
# jenkins-script-library as a Global Trusted Pipeline Library.
#
# Load via CASC_JENKINS_CONFIG=/var/jenkins_home/casc_configs/jenkins.yaml
# with the configuration-as-code and pipeline-groovy-lib plugins installed.

unclassified:
  globalLibraries:
    libraries:
      - name: "jenkins-script-library"
        # Pin to a post-v1.0.0 release tag or commit SHA that includes vars/helmDeploy.groovy.
        defaultVersion: "${JENKINS_LIBRARY_VERSION:-main}"
        implicit: false
        allowVersionOverride: true
        includeInChangesets: false
        retriever:
          modernSCM:
            scm:
              git:
                remote: "https://github.com/somethingwithproof/jenkins-script-library.git"
                traits:
                  - gitBranchDiscovery
                  - gitTagDiscovery
